<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>

  {% if page.description %}
    <meta name="description" content="{{ page.description | strip_html | escape }}">
  {% elsif site.description %}
    <meta name="description" content="{{ site.description | strip_html | escape }}">
  {% endif %}

  {% if page.keywords %}
    <meta name="keywords" content="{{ page.keywords | escape }}">
  {% elsif site.keywords %}
    <meta name="keywords" content="{{ site.keywords | escape }}">
  {% endif %}

  <meta name="robots" content="{% if page.robots %}{{ page.robots }}{% else %}index, follow{% endif %}">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  {% assign canonical_url = page.canonical | default: page.url | absolute_url %}
  <link rel="canonical" href="{{ canonical_url }}">

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="{{ '/assets/img/datafrog.png' | prepend: site.baseurl }}" type="image/png">
  <link rel="shortcut icon" href="{{ '/assets/img/datafrog.png' | prepend: site.baseurl }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/img/datafrog.png' | prepend: site.baseurl }}">

  <meta name="theme-color" content="#0f172a">
  <meta name="msapplication-navbutton-color" content="#0f172a">
  <meta name="apple-mobile-web-app-status-bar-style" content="#0f172a">

  <meta property="og:type" content="{% if page.is_post or page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description | strip_html | escape }}{% elsif site.description %}{{ site.description | strip_html | escape }}{% endif %}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:site_name" content="DataFrog">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="{% if page.image %}{{ page.image | absolute_url }}{% elsif page.img %}{{ '/assets/img/' | append: page.img | absolute_url }}{% else %}https://datafrog.tools/assets/img/datafrog.png{% endif %}">
  {% if page.is_post or page.layout == 'post' %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  <meta property="article:modified_time" content="{{ page.updated | default: page.date | date_to_xmlschema }}">
  {% endif %}

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta name="twitter:description" content="{% if page.description %}{{ page.description | strip_html | escape }}{% elsif site.description %}{{ site.description | strip_html | escape }}{% endif %}">
  <meta name="twitter:image" content="{% if page.image %}{{ page.image | absolute_url }}{% elsif page.img %}{{ '/assets/img/' | append: page.img | absolute_url }}{% else %}https://datafrog.tools/assets/img/datafrog.png{% endif %}">

  <script src="https://analytics.ahrefs.com/analytics.js" data-key="rcwqWZs4F7TML/u0B6Sk9g" async></script>

  {% include schema.html %}
</head>
